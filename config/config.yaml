# BigA Stock Analysis Configuration

# Application Settings
app:
  title: "大A股数据分析"
  version: "1.0.0"
  debug: true

# Data Sources Configuration
# Secrets: set TUSHARE_TOKEN in the environment or a local .env file.
# Do not commit a real token here.
data_sources:
  primary: akshare
  fallback: true  # 主源失败时自动尝试另一源

  # TuShare Pro - 数据质量高，需要积分/权限
  tushare:
    enabled: true
    token: ""  # 留空，改用环境变量 TUSHARE_TOKEN
    base_url: "http://api.tushare.pro"
    timeout: 30
    retries: 3
    retry_budget: 45  # 单次调用总时间上限（秒），超时不叠加重试

  # AKShare - 免费开源，无需注册，默认主源
  akshare:
    enabled: true
    base_url: "https://akshare.akfamily.xyz"
    timeout: 30
    retries: 3
    retry_budget: 45
    adjust: ""  # "" 不复权, qfq 前复权, hfq 后复权

# Data quality / cleaning
data_quality:
  max_abs_return: 1.0   # 单日涨跌超过该阈值标记 is_outlier
  drop_outlier_bars: false

# Analysis Settings
analysis:
  # Technical Analysis
  technical:
    indicators:
      - MA  # 移动平均线
      - MACD
      - RSI
      - BOLL  # 布林带
      - KDJ
    
    ma_periods: [5, 10, 20, 60]
    rsi_period: 14
    macd_params:
      fast: 12
      slow: 26
      signal: 9
  
  # Portfolio Analysis
  portfolio:
    risk_free_rate: 0.03  # 无风险利率 3%
    trading_days: 252     # 年交易日数

# Visualization Settings
visualization:
  # Chart Theme
  theme:
    bg_color: "white"
    grid_color: "lightgray"
    up_color: "#FF4444"    # 上涨红色
    down_color: "#00AA00"  # 下跌绿色
    volume_color: "#666666"
  
  # Default Chart Settings
  kline:
    height: 600
    candlestick: true
    volume: true
    indicators: true

# Cache Settings
# Web 与 CLI 共享 data/cache；盘中短 TTL，失败短冷却，禁止同日永久缓存。
cache:
  enabled: true
  persist: true
  ttl: 300            # 历史行情默认 5 分钟（仍受 ttl_success_max 上限）
  ttl_realtime: 30    # 盘中快照 / 指数 / 资金流
  ttl_list: 3600      # 股票列表 / 基本信息
  ttl_calendar: 86400 # 交易日历
  ttl_failure: 45     # 失败冷却，避免雪崩打上游
  ttl_success_max: 3600
  max_size: 1000
  directory: "data/cache"

# UI Settings
ui:
  # Page Configuration
  pages:
    - name: "首页"
      icon: "🏠"
      module: "_home"
    - name: "股票分析"
      icon: "📈"
      module: "_stock_analysis"
    - name: "股票筛选"
      icon: "🔍"
      module: "_screener"
    - name: "投资组合"
      icon: "💼"
      module: "_portfolio"
    - name: "市场分析"
      icon: "📊"
      module: "_market"
  
  # Display Settings
  sidebar:
    default_state: "expanded"
  
  main:
    wide_mode: true
    theme:
      primary_color: "#1f77b4"
      background_color: "#ffffff"
      secondary_background_color: "#f0f2f6"
      text_color: "#262730"
      font: "sans serif"

